[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "procure-to-pay-datagen"
version = "1.0.0"
description = "Procure-to-Pay Synthetic Data Generator"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "YottaFlex AI Engineering Team" }
]
dependencies = [
    "numpy==2.2.3",
    "pandas==2.2.3",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[project.scripts]
p2p-datagen = "datagen.cli:main"
p2p-validate = "validate.checks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
